; ============================================================
;  Case Feeder Pro - PlatformIO build configuration
;
;  Firmware images:
;    controller      BigTreeTech SKR Pico V1.0 (RP2040). Runs the motors,
;                    beams, jam detection and settings for a case feeder, a
;                    bullet feeder, or both.
;    lcd             LCDWiki ES3C28P 2.8" ESP32-S3 touchscreen (ILI9341 +
;                    FT6336 + ES8311). Shows the feeders and controls them
;                    over a UART link.
;    lcd_waveshare   Waveshare ESP32-S3-Touch-LCD-2.8 (ST7789 + CST328 +
;                    PCM5101). Same touchscreen firmware, that board's pins.
;
;  Build and flash:  pio run -e controller -t upload
;                    pio run -e lcd -t upload
;                    pio run -e lcd_waveshare -t upload
;  See docs/BUILD_GUIDE.md.
; ============================================================

[platformio]
default_envs = controller, lcd

[env:controller]
platform         = https://github.com/maxgerhardt/platform-raspberrypi.git
board            = rpipico
framework        = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
monitor_speed    = 115200
; Upload by copying the UF2 onto the board's RPI-RP2 drive (PlatformIO
; resets the board into its bootloader first). Needs no extra USB driver.
upload_protocol  = mbed
build_src_filter =
    +<controller.cpp>
lib_ignore       = FT6336, CST328
lib_deps =
    teemuatlut/TMCStepper @ ^0.7.3
    adafruit/Adafruit NeoPixel @ ^1.12.3

[env:lcd]
platform        = espressif32@^6.5.0
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder
lib_ldf_mode    = deep+
build_src_filter =
    +<lcd_terminal.cpp>
; The Waveshare touch driver is a separate library. Keep it out of this image.
lib_ignore      = CST328
lib_deps =
    lvgl/lvgl @ ^8.4.0
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Optional: start with the screen turned 180 degrees
    ; -DSCREEN_FLIPPED=1
    ; LVGL: use src/lv_conf.h
    -DLV_CONF_INCLUDE_SIMPLE
    -I src
    ; TFT_eSPI display configuration (replaces User_Setup.h)
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; Waveshare ESP32-S3-Touch-LCD-2.8. Pins checked against the product wiki
; (Internal Hardware Connection) and the Arduino/ESP-IDF demo from
; ESP32-S3-Touch-LCD-2.8-Demo.zip:
;   ST7789  MOSI 45, SCLK 40, CS 42, DC 41, RST 39, BL 5 (on = high), MISO not connected
;   CST328  SDA 1, SCL 3, INT 4, RST 2, I2C 0x1A on Wire1 (not the GPIO11/10 header)
;   PCM5101 BCK 48, LRCK 38, DIN 47, no MCLK and no amp-enable GPIO
;   UART to the SKR Pico stays GPIO43 TX / GPIO44 RX
; GPIO1 is touch SDA here. The ES3C28P amp-enable on GPIO1 is not built in.
[env:lcd_waveshare]
extends         = env:lcd
lib_ignore      = FT6336
build_flags     =
    -D CORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_WAVESHARE=1
    ; Optional: start with the screen turned 180 degrees
    ; -DSCREEN_FLIPPED=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I src
    ; TFT_eSPI. Rotation 0 of this driver is MADCTL 0x00, which is what
    ; Waveshare's Arduino demo programs, and where its touch coordinates
    ; already match the panel. SPI is FSPI (the demo's SPIClass(FSPI));
    ; the demo clocks the panel at 80 MHz.
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=45
    -DTFT_SCLK=40
    -DTFT_CS=42
    -DTFT_DC=41
    -DTFT_RST=39
    -DTFT_BL=5
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
